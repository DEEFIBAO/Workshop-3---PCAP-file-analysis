<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PCAP Sentinel</title>
  <!--
    W - The web page.
    Start the server from the main folder (python start.py) and open http://127.0.0.1:8000

    This page already works. Tweak it as much as you like: colours, layout, extra columns.
    "Demo data" loads a made-up report from /api/demo, so you can restyle the page
    even before the detectors are written.
  -->
  <style>
    body { font-family: system-ui, "Segoe UI", sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; color: #16191c; background: #f5f6f3; }
    h1 { margin-bottom: 4px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: #fff; padding: 14px; border-radius: 10px; border: 1px solid #dcdfe2; }
    button { padding: 8px 16px; border: 0; border-radius: 6px; background: #2463c0; color: #fff; font-weight: 600; cursor: pointer; }
    #summary { margin: 20px 0; font-size: 18px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #dcdfe2; }
    th { background: #eef0f2; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
    /* BONUS: give rows a class of "high" or "medium" to colour them */
    tr.high td { background: #fbe5df; }
    tr.medium td { background: #fbf1d6; }
    tr.low td { background: #e3eefb; }
    button.secondary { background: #fff; color: #2463c0; border: 1px solid #2463c0; }
    button:disabled { opacity: .6; cursor: wait; }
    #summary .error { color: #b3261e; }
    .muted { color: #6b7075; font-size: 15px; }
    td.sev { font-weight: 700; text-transform: uppercase; font-size: 13px; }
  </style>
</head>
<body>
  <h1>PCAP Sentinel</h1>
  <p>Upload a packet capture to look for attacks.</p>

  <form id="form">
    <input type="file" id="file" accept=".pcap,.pcapng">
    <button type="submit" id="go">Analyse</button>
    <button type="button" id="demo" class="secondary">Demo data</button>
  </form>

  <div id="summary"></div>

  <table>
    <thead><tr><th>Severity</th><th>Alert</th><th>From</th><th>To</th><th>Detail</th></tr></thead>
    <tbody id="alerts"></tbody>
  </table>

  <script>
    const summary = document.getElementById('summary');
    const tbody = document.getElementById('alerts');
    const button = document.getElementById('go');

    document.getElementById('form').addEventListener('submit', async (event) => {
      event.preventDefault();

      const file = document.getElementById('file').files[0];
      if (!file) {
        summary.innerHTML = '<span class="error">Choose a .pcap file first.</span>';
        return;
      }

      // AFTER THE JOIN: send the real file to the analyzer
      button.disabled = true;
      button.textContent = 'Analysing...';
      summary.innerHTML = `<span class="muted">Reading ${escapeHtml(file.name)}. Big captures can take up to a minute...</span>`;
      tbody.innerHTML = '';

      try {
        const body = new FormData();
        body.append('file', file);
        const res = await fetch('/api/analyze', { method: 'POST', body });
        const report = await res.json();
        if (!res.ok) {
          showError(report.error || `Server error ${res.status}`, report.details);
        } else {
          show(report);
        }
      } catch (err) {
        showError('Could not reach the server. Is "python start.py" still running?', String(err));
      } finally {
        button.disabled = false;
        button.textContent = 'Analyse';
      }
    });

    function show(report) {
      // TODO 1: file name, number of packets and risk score
      const protos = Object.entries(report.protocols || {})
        .map(([name, count]) => `${name} ${count.toLocaleString()}`).join(' · ');
      summary.innerHTML =
        `<strong>${escapeHtml(report.file)}</strong>: ${report.packets.toLocaleString()} packets, ` +
        `risk score <strong>${report.risk_score}</strong>/100, ${report.alerts.length} alert(s)` +
        (protos ? `<br><span class="muted">${escapeHtml(protos)}</span>` : '');

      // TODO 2: empty the table, then one row per alert (most severe first)
      tbody.innerHTML = '';
      const order = { high: 0, medium: 1, low: 2 };
      const alerts = [...report.alerts].sort((a, b) => (order[a.severity] ?? 3) - (order[b.severity] ?? 3));
      for (const a of alerts) {
        const row = document.createElement('tr');
        row.className = a.severity;              // BONUS: colours the row
        for (const value of [a.severity, a.title, a.src, a.dst, a.detail]) {
          const cell = document.createElement('td');
          cell.textContent = value ?? '';
          row.appendChild(cell);
        }
        row.firstChild.className = 'sev';
        tbody.appendChild(row);
      }

      // TODO 3: no alerts -> one row saying so
      if (alerts.length === 0) {
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 5;
        cell.innerHTML = 'No threats found. <span class="muted">If your detectors still have TODOs, ' +
          'that\'s why: run <code>python check.py</code> to see who is finished.</span>';
        row.appendChild(cell);
        tbody.appendChild(row);
      }
    }

    document.getElementById('demo').addEventListener('click', async () => {
      try {
        const report = await (await fetch('/api/demo')).json();
        show(report);
        summary.insertAdjacentHTML('afterbegin', '<span class="muted">DEMO DATA (made up): </span>');
      } catch (err) {
        showError('Could not reach the server. Is "python start.py" still running?', String(err));
      }
    });

    function showError(message, details) {
      summary.innerHTML = `<span class="error">${escapeHtml(message)}</span>`;
      if (details) console.error(details);   // full error in the browser console (F12)
      tbody.innerHTML = '';
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }
  </script>
</body>
</html>
